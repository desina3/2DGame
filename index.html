<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK BLAST</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #4da6ff;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(77, 166, 255, 0.4);
        }

        .score-board {
            font-size: 24px;
            font-weight: 600;
            color: #e0e0e0;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            position: relative;
        }

        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        /* 8x8 Board */
        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            background-color: #1e1e24;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 380px;
            height: 380px;
        }

        .cell {
            background-color: #2a2a32;
            border-radius: 4px;
            transition: background-color 0.15s ease;
        }

        .cell.filled {
            box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.3);
        }

        .cell.preview {
            background-color: rgba(77, 255, 136, 0.4) !important;
            border: 2px dashed #4dff88;
        }

        /* Tray & Available Blocks */
        .tray {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            background-color: #1e1e24;
            padding: 20px;
            border-radius: 10px;
            min-width: 200px;
            min-height: 140px;
        }

        @media (min-width: 768px) {
            .tray {
                flex-direction: column;
                justify-content: space-around;
                width: 160px;
                height: 380px;
            }
        }

        .block-slot {
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .block-container {
            display: grid;
            gap: 2px;
            cursor: grab;
            touch-action: none;
        }

        .block-container:active {
            cursor: grabbing;
        }

        .block-cell {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .block-cell.empty {
            background-color: transparent !important;
        }

        /* Drag Overlay Element */
        .dragging-block {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            display: grid;
            gap: 4px;
            transform: translate(-50%, -50%);
        }

        .dragging-block .block-cell {
            width: 43px;
            height: 43px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Game Over Overlay */
        .game-over-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .game-over-modal.show {
            opacity: 1;
            pointer-events: auto;
        }

        .game-over-title {
            font-size: 32px;
            color: #ff4d4d;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .final-score {
            font-size: 20px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .restart-btn {
            background-color: #4da6ff;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: #1a8cff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">BLOCK BLAST</h1>
        <div class="score-board">SCORE: <span id="score">0</span></div>
    </div>

    <div class="game-container">
        <div class="board" id="board"></div>

        <div class="tray" id="tray">
            <div class="block-slot" data-slot="0"></div>
            <div class="block-slot" data-slot="1"></div>
            <div class="block-slot" data-slot="2"></div>
        </div>

        <div class="game-over-modal" id="gameOverModal">
            <div class="game-over-title">GAME OVER</div>
            <div class="final-score">Final Score: <span id="finalScore">0</span></div>
            <button class="restart-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script>
        // --- CONSTANTS & CONFIGURATION ---
        const GRID_SIZE = 8;
        const SHAPES = [
            { shape: [[1]], color: '#ff4d4d' }, // 1. Single
            { shape: [[1, 1]], color: '#ff944d' }, // 2. 2-Horiz
            { shape: [[1], [1]], color: '#ffda4d' }, // 3. 2-Vert
            { shape: [[1, 1, 1]], color: '#4dff88' }, // 4. 3-Horiz
            { shape: [[1], [1], [1]], color: '#4dffff' }, // 5. 3-Vert
            { shape: [[1, 1], [1, 1]], color: '#4da6ff' }, // 6. 2x2 Square
            { shape: [[1, 0], [1, 0], [1, 1]], color: '#b34dff' }, // 7. L-Shape
            { shape: [[1, 1, 1], [0, 1, 0]], color: '#ff4da6' }  // 8. T-Shape
        ];

        // --- GAME STATE ---
        let boardState = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
        let availableBlocks = [null, null, null];
        let score = 0;
        let isGameOver = false;

        // --- DRAG STATE ---
        let activeDrag = null;
        let dragElement = null;

        // --- DOM ELEMENTS ---
        const boardEl = document.getElementById('board');
        const trayEl = document.getElementById('tray');
        const scoreEl = document.getElementById('score');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalScoreEl = document.getElementById('finalScore');

        // --- SOUND EFFECTS (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'pickup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'place') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(60, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'clear') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.4);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            }
        }

        // --- INITIALIZATION ---
        function init() {
            createBoardDOM();
            resetGame();
            addDragListeners();
        }

        function createBoardDOM() {
            boardEl.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardEl.appendChild(cell);
                }
            }
        }

        function resetGame() {
            boardState = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
            score = 0;
            isGameOver = false;
            scoreEl.textContent = '0';
            gameOverModal.classList.remove('show');
            renderBoard();
            spawnTrayBlocks();
        }

        // --- TRAY & BLOCKS GENERATION ---
        function spawnTrayBlocks() {
            for (let i = 0; i < 3; i++) {
                if (!availableBlocks[i]) {
                    const randomTemplate = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                    availableBlocks[i] = JSON.parse(JSON.stringify(randomTemplate));
                }
            }
            renderTray();
            checkGameOverCondition();
        }

        function renderTray() {
            const slots = trayEl.querySelectorAll('.block-slot');
            slots.forEach((slot, index) => {
                slot.innerHTML = '';
                const blockData = availableBlocks[index];
                if (blockData) {
                    const container = createBlockElement(blockData, index, 20);
                    slot.appendChild(container);
                }
            });
        }

        function createBlockElement(blockData, slotIndex, cellSize) {
            const rows = blockData.shape.length;
            const cols = blockData.shape[0].length;

            const container = document.createElement('div');
            container.classList.add('block-container');
            container.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
            container.dataset.slot = slotIndex;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('block-cell');
                    if (blockData.shape[r][c] === 1) {
                        cell.style.backgroundColor = blockData.color;
                    } else {
                        cell.classList.add('empty');
                    }
                    container.appendChild(cell);
                }
            }
            return container;
        }

        // --- DRAG & DROP LOGIC ---
        function addDragListeners() {
            window.addEventListener('pointerdown', handlePointerDown);
            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
        }

        function handlePointerDown(e) {
            if (isGameOver) return;
            const blockContainer = e.target.closest('.block-container');
            if (!blockContainer) return;

            const slotIndex = parseInt(blockContainer.dataset.slot, 10);
            const blockData = availableBlocks[slotIndex];
            if (!blockData) return;

            playSound('pickup');

            activeDrag = {
                slotIndex: slotIndex,
                blockData: blockData
            };

            // Create floating drag element
            dragElement = createBlockElement(blockData, slotIndex, 43);
            dragElement.classList.add('dragging-block');
            document.body.appendChild(dragElement);

            updateDragPosition(e.clientX, e.clientY);
            blockContainer.style.opacity = '0.2';
        }

        function handlePointerMove(e) {
            if (!activeDrag || !dragElement) return;
            updateDragPosition(e.clientX, e.clientY);
            updateBoardPreview(e.clientX, e.clientY);
        }

        function handlePointerUp(e) {
            if (!activeDrag) return;

            clearPreviews();
            const gridPos = getGridCoordinates(e.clientX, e.clientY);

            if (gridPos && canPlaceBlock(activeDrag.blockData, gridPos.row, gridPos.col)) {
                placeBlock(activeDrag.blockData, gridPos.row, gridPos.col);
                playSound('place');

                // Update placement points
                const cellCount = activeDrag.blockData.shape.flat().filter(x => x === 1).length;
                score += cellCount * 10;

                // Handle line clearing
                const linesCleared = checkAndClearLines();
                if (linesCleared > 0) {
                    score += linesCleared * 100;
                    playSound('clear');
                }

                scoreEl.textContent = score;

                // Consume block
                availableBlocks[activeDrag.slotIndex] = null;

                // Check if all 3 used
                if (availableBlocks.every(b => b === null)) {
                    spawnTrayBlocks();
                } else {
                    renderTray();
                    checkGameOverCondition();
                }
            } else {
                // Restore original block visibility on invalid drop
                renderTray();
            }

            // Cleanup drag state
            if (dragElement) dragElement.remove();
            dragElement = null;
            activeDrag = null;
        }

        function updateDragPosition(x, y) {
            if (dragElement) {
                dragElement.style.left = `${x}px`;
                dragElement.style.top = `${y}px`;
            }
        }

        function getGridCoordinates(x, y) {
            const rect = boardEl.getBoundingClientRect();
            if (x < rect.left || x > rect.right || y < rect.top || y > rect.bottom) {
                return null;
            }

            const activeCellSize = rect.width / GRID_SIZE;
            const col = Math.floor((x - rect.left) / activeCellSize);
            const row = Math.floor((y - rect.top) / activeCellSize);

            // Center-align placement relative to shape size
            const shape = activeDrag.blockData.shape;
            const targetRow = row - Math.floor(shape.length / 2);
            const targetCol = col - Math.floor(shape[0].length / 2);

            return { row: targetRow, col: targetCol };
        }

        // --- BOARD RULES & VALIDATION ---
        function canPlaceBlock(blockData, startRow, startCol) {
            const shape = blockData.shape;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c] === 1) {
                        const targetR = startRow + r;
                        const targetC = startCol + c;

                        if (targetR < 0 || targetR >= GRID_SIZE || targetC < 0 || targetC >= GRID_SIZE) {
                            return false;
                        }
                        if (boardState[targetR][targetC] !== null) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function placeBlock(blockData, startRow, startCol) {
            const shape = blockData.shape;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c] === 1) {
                        boardState[startRow + r][startCol + c] = blockData.color;
                    }
                }
            }
            renderBoard();
        }

        function updateBoardPreview(clientX, clientY) {
            clearPreviews();
            const gridPos = getGridCoordinates(clientX, clientY);
            if (!gridPos) return;

            if (canPlaceBlock(activeDrag.blockData, gridPos.row, gridPos.col)) {
                const shape = activeDrag.blockData.shape;
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (shape[r][c] === 1) {
                            const cell = getCellDOM(gridPos.row + r, gridPos.col + c);
                            if (cell) cell.classList.add('preview');
                        }
                    }
                }
            }
        }

        function clearPreviews() {
            const previews = boardEl.querySelectorAll('.preview');
            previews.forEach(cell => cell.classList.remove('preview'));
        }

        function checkAndClearLines() {
            let rowsToClear = [];
            let colsToClear = [];

            // Identify complete rows
            for (let r = 0; r < GRID_SIZE; r++) {
                if (boardState[r].every(cell => cell !== null)) {
                    rowsToClear.push(r);
                }
            }

            // Identify complete columns
            for (let c = 0; c < GRID_SIZE; c++) {
                let colFull = true;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (boardState[r][c] === null) {
                        colFull = false;
                        break;
                    }
                }
                if (colFull) colsToClear.push(c);
            }

            // Clear rows
            rowsToClear.forEach(r => {
                for (let c = 0; c < GRID_SIZE; c++) boardState[r][c] = null;
            });

            // Clear columns
            colsToClear.forEach(c => {
                for (let r = 0; r < GRID_SIZE; r++) boardState[r][c] = null;
            });

            if (rowsToClear.length > 0 || colsToClear.length > 0) {
                renderBoard();
            }

            return rowsToClear.length + colsToClear.length;
        }

        function checkGameOverCondition() {
            for (let i = 0; i < 3; i++) {
                const block = availableBlocks[i];
                if (!block) continue;

                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (canPlaceBlock(block, r, c)) {
                            return; // A move exists
                        }
                    }
                }
            }

            // Game over triggered
            isGameOver = true;
            playSound('gameover');
            finalScoreEl.textContent = score;
            gameOverModal.classList.add('show');
        }

        // --- RENDER HELPERS ---
        function renderBoard() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = getCellDOM(r, c);
                    const color = boardState[r][c];
                    if (color) {
                        cell.style.backgroundColor = color;
                        cell.classList.add('filled');
                    } else {
                        cell.style.backgroundColor = '';
                        cell.classList.remove('filled');
                    }
                }
            }
        }

        function getCellDOM(row, col) {
            return boardEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        // Run setup on load
        window.onload = init;
    </script>
</body>
</html>
